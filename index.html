<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAKUARA - Financial Management</title>
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:wallet-cards.svg?color=%23173F35">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <!-- VIEW LOGIN -->
  <div id="auth-view" class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
              <i data-lucide="wallet-cards" style="width: 32px; height: 32px;"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">SAKUARA</h3>
            <p class="text-muted small">Kelola Keuangan Keluarga & Pribadi Cerdas</p>
          </div>
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Email Akun</label>
              <input type="email" class="form-control bg-light rounded-3 py-2" id="email" placeholder="nama@email.com" required>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold text-secondary">Kata Sandi</label>
              <input type="password" class="form-control bg-light rounded-3 py-2" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-bold shadow-sm" style="background-color: #173F35; border: none;">Masuk / Daftar</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- VIEW APLIKASI -->
  <div id="app-view" class="d-none">
    <div class="container-fluid">
      <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse shadow-sm min-vh-100 p-0">
          <div class="position-sticky pt-3">
            <div class="sidebar-brand px-4 py-3 d-flex align-items-center gap-2 mb-3">
              <i data-lucide="wallet-cards" class="text-success" style="width: 28px; height: 28px;"></i>
              <span class="fs-4 fw-bold text-dark">SAKUARA</span>
            </div>
            <ul class="nav flex-column px-2 gap-1">
              <li class="nav-item"><a href="#" onclick="navigate('dashboard')" class="nav-link active rounded-3 px-3 py-2"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
              <li class="nav-item"><a href="#" onclick="navigate('accounts')" class="nav-link rounded-3 px-3 py-2 text-dark"><i data-lucide="landmark"></i> Rekening</a></li>
              <li class="nav-item"><a href="#" onclick="navigate('transactions')" class="nav-link rounded-3 px-3 py-2 text-dark"><i data-lucide="arrow-left-right"></i> Transaksi</a></li>
              <li class="nav-item"><a href="#" onclick="navigate('budget')" class="nav-link rounded-3 px-3 py-2 text-dark"><i data-lucide="pie-chart"></i> Budget Planner</a></li>
              <li class="nav-item"><a href="#" onclick="navigate('health')" class="nav-link rounded-3 px-3 py-2 text-dark"><i data-lucide="activity"></i> Kesehatan Keuangan</a></li>
            </ul>
            <div class="px-4 mt-5">
              <button onclick="logout()" class="btn btn-outline-danger w-100 rounded-3 btn-sm py-2">Keluar</button>
            </div>
          </div>
        </nav>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
          <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h4 fw-bold text-dark" id="page-title">Dashboard</h1>
          </div>
          <div id="content-area"></div>
        </main>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
