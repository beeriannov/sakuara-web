<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAKUARA - Financial Management</title>
  
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide:wallet-cards.svg?color=%23173F35">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <!-- VIEW LOGIN / AUTHENTICATION -->
  <div id="auth-view" class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-md-5 col-lg-4">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle mb-3" style="width: 64px; height: 64px;">
              <i data-lucide="wallet-cards" style="width: 32px; height: 32px;"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">SAKUARA</h3>
            <p class="text-muted small">Kelola Keuangan Keluarga & Pribadi Cerdas</p>
          </div>

          <form id="login-form">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Email Akun</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-3"><i data-lucide="mail" style="width: 18px;" class="text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0 rounded-end-3 py-2" id="email" placeholder="nama@email.com" required>
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label small fw-bold text-secondary">Kata Sandi</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 rounded-start-3"><i data-lucide="lock" style="width: 18px;" class="text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0 rounded-end-3 py-2" id="password" placeholder="••••••••" required>
              </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-bold shadow-sm" style="background-color: #173F35; border: none;">
              Masuk / Daftar Otomatis
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- VIEW UTAMA APLIKASI -->
  <div id="app-view" class="d-none">
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar Desktop -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse shadow-sm min-vh-100 p-0">
          <div class="position-sticky pt-3">
            <div class="sidebar-brand px-4 py-3 d-flex align-items-center gap-2 mb-3">
              <i data-lucide="wallet-cards" class="text-success" style="width: 28px; height: 28px;"></i>
              <span class="fs-4 fw-bold text-dark">SAKUARA</span>
            </div>
            <ul class="nav flex-column px-2 gap-1">
              <li class="nav-item"><a href="#" onclick="navigate('dashboard')" class="nav-link active rounded-3 px-3 py-2 d-flex align-items-center gap-2"><i data-lucide="layout-dashboard" style="width:18px;"></i> <span data-i18n="dashboard">Dashboard</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('accounts')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="landmark" style="width:18px;"></i> <span data-i18n="accounts">Rekening</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('transactions')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="arrow-left-right" style="width:18px;"></i> <span data-i18n="transactions">Transaksi</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('budget')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="pie-chart" style="width:18px;"></i> <span data-i18n="budget">Budget Planner</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('analytics')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="trending-up" style="width:18px;"></i> <span data-i18n="analytics">Analitik</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('bills')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="receipt" style="width:18px;"></i> <span data-i18n="bills">Tagihan</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('health')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="activity" style="width:18px;"></i> <span data-i18n="health">Kesehatan Keuangan</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('savings')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="target" style="width:18px;"></i> <span data-i18n="savings">Target & Utang</span></a></li>
              <li class="nav-item"><a href="#" onclick="navigate('settings')" class="nav-link rounded-3 px-3 py-2 d-flex align-items-center gap-2 text-dark"><i data-lucide="settings" style="width:18px;"></i> <span data-i18n="settings">Pengaturan</span></a></li>
            </ul>
            <div class="px-4 mt-5">
              <button onclick="logout()" class="btn btn-outline-danger w-100 rounded-3 btn-sm d-flex align-items-center justify-content-center gap-2 py-2">
                <i data-lucide="log-out" style="width: 16px;"></i> <span>Keluar</span>
              </button>
            </div>
          </div>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
          <div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h4 fw-bold text-dark fade-in" id="page-title">Dashboard</h1>
            <div class="d-flex align-items-center gap-3">
              <select id="lang-switch" class="form-select form-select-sm rounded-pill px-3" onchange="switchLanguage(this.value)">
                <option value="id">ID</option>
                <option value="en">EN</option>
              </select>
              <button class="btn btn-success rounded-circle p-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 40px; height: 40px; background-color: #173F35; border:none;" onclick="showTransactionModal()">
                <i data-lucide="plus" style="width: 20px; height: 20px;"></i>
              </button>
            </div>
          </div>

          <!-- Konten Halaman Dinamis -->
          <div id="content-area" class="fade-in"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- Modal Tambah Transaksi -->
  <div class="modal fade" id="trxModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Tambah Transaksi Baru</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="trx-form" onsubmit="handleTransactionSubmit(event)">
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Jenis Transaksi</label>
              <select class="form-select rounded-3" id="trx-type">
                <option value="Expense">Pengeluaran (Expense)</option>
                <option value="Income">Pemasukan (Income)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Nominal (Rp)</label>
              <input type="number" class="form-control rounded-3 fw-bold" id="trx-amount" placeholder="Contoh: 50000" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold text-secondary">Kategori</label>
              <input type="text" class="form-control rounded-3" id="trx-category" placeholder="Contoh: Makanan, Transport, Gaji" required>
            </div>
            <button type="submit" class="btn w-100 py-2 rounded-3 fw-bold text-white mt-2" style="background-color: #173F35;">Simpan Transaksi</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
